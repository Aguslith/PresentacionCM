<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&amp;display=swap');
      .brand-title {
        font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #0D1D34;
        letter-spacing: 0.18em;
      }
      .brand-subtitle {
        font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #1D5A8F;
        letter-spacing: 0.35em;
      }
    </style>
    <linearGradient id="skyGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ec3eb" />
      <stop offset="100%" stop-color="#5FA8D3" />
    </linearGradient>
    <linearGradient id="navyGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D5A8F" />
      <stop offset="100%" stop-color="#0D1D34" />
    </linearGradient>
  </defs>

  <!-- Isotype on Left -->
  <g transform="translate(10, 15) scale(0.65)">
    <polygon points="100,30 135,30 170,165 130,165" fill="url(#navyGradH)" />
    <polygon points="100,30 65,30 30,165 70,165" fill="url(#skyGradH)" />
    <polygon points="56,75 110,85 104,98 48,88" fill="#FFFFFF" opacity="0.95" />
    <polygon points="44,115 100,125 94,138 38,128" fill="#FFFFFF" opacity="0.95" />
    <polygon points="75,50 120,58 116,68 70,60" fill="#E0F2FE" opacity="0.8" />
  </g>

  <!-- Brand Typography Lockup on Right -->
  <g transform="translate(155, 82)">
    <text class="brand-title" x="0" y="0">ALPACLADD</text>
    <text class="brand-subtitle" x="2" y="32">FÁBRICA DE HILADOS</text>
  </g>
</svg>
