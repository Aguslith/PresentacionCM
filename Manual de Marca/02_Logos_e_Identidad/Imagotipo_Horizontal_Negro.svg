<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800&amp;display=swap');
      .brand-title-black {
        font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #000000;
        letter-spacing: 0.18em;
      }
      .brand-subtitle-black {
        font-family: 'Raleway', 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 16px;
        fill: #444444;
        letter-spacing: 0.35em;
      }
    </style>
  </defs>

  <!-- Isotype on Left (Monochrome black) -->
  <g transform="translate(10, 15) scale(0.65)">
    <polygon points="100,30 135,30 170,165 130,165" fill="#000000" />
    <polygon points="100,30 65,30 30,165 70,165" fill="#444444" />
    <polygon points="56,75 110,85 104,98 48,88" fill="#FFFFFF" />
    <polygon points="44,115 100,125 94,138 38,128" fill="#FFFFFF" />
    <polygon points="75,50 120,58 116,68 70,60" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography Lockup on Right -->
  <g transform="translate(155, 82)">
    <text class="brand-title-black" x="0" y="0">ALPACLADD</text>
    <text class="brand-subtitle-black" x="2" y="32">FÁBRICA DE HILADOS</text>
  </g>
</svg>
