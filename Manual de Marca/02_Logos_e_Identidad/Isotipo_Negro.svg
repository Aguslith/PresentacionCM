<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Isotipo Negro Monocromático para impresión de 1 tinta o fondos claros -->
  <g fill="#000000">
    <!-- Right Leg (Solid) -->
    <polygon points="100,30 135,30 170,165 130,165" />
    
    <!-- Left Leg (60% Gray or solid with white cuts) -->
    <polygon points="100,30 65,30 30,165 70,165" fill="#444444" />
    
    <!-- Thread Cuts (Knockout White) -->
    <polygon points="56,75 110,85 104,98 48,88" fill="#FFFFFF" />
    <polygon points="44,115 100,125 94,138 38,128" fill="#FFFFFF" />
    <polygon points="75,50 120,58 116,68 70,60" fill="#FFFFFF" />
  </g>
</svg>
